syntax = "proto3";

package com.cusp.v1.loyalty;

import "google/protobuf/wrappers.proto";

option java_multiple_files = true;
option java_package = "com.cusp.generated.grpc.v1.loyalty";
option java_outer_classname = "LoyaltyProgramServiceProto";

service LoyaltyProgramService {
  rpc ListLoyaltyPrograms(ListLoyaltyProgramsRequest) returns (ListLoyaltyProgramsResponse);
  rpc GetLoyaltyProgram(GetLoyaltyProgramRequest) returns (GetLoyaltyProgramResponse);
  rpc FindCardLoyaltyTransferRatios(FindCardLoyaltyTransferRatiosRequest) returns (FindCardLoyaltyTransferRatiosResponse);
}

// Service for airline-specific loyalty program operations
service AirlineLoyaltyProgramService {
  rpc ListAirlineLoyaltyPrograms(ListAirlineLoyaltyProgramsRequest) returns (ListAirlineLoyaltyProgramsResponse);
  rpc GetAirlineLoyaltyProgram(GetAirlineLoyaltyProgramRequest) returns (GetAirlineLoyaltyProgramResponse);
}

// Service for flight award-cost prediction backed by core-service award charts.
service AwardChartService {
  rpc PredictAwardCost(PredictAwardCostRequest) returns (PredictAwardCostResponse);
}

enum LoyaltyProgramType {
  LOYALTY_PROGRAM_TYPE_UNSPECIFIED = 0;
  AIRLINE = 1;
  HOTEL = 2;
}

// Airline alliance enum
enum AirlineAlliance {
  AIRLINE_ALLIANCE_UNSPECIFIED = 0;
  NONE = 1;
  STAR_ALLIANCE = 2;
  ONEWORLD = 3;
  SKYTEAM = 4;
}

// Airline codes enum
enum AirlineCode {
  AIRLINE_CODE_UNSPECIFIED = 0;
  AIR_INDIA = 1;
  SINGAPORE_AIRLINES = 2;
  THAI_AIRWAYS = 3;
  EMIRATES = 4;
  QATAR_AIRWAYS = 5;
  VISTARA = 6;
  INDIGO = 7;
  BRITISH_AIRWAYS = 8;
  LUFTHANSA = 9;
  AIR_FRANCE_KLM = 10;
  ETIHAD_AIRWAYS = 11;
  CATHAY_PACIFIC = 12;
}

// Loyalty program codes (airlines and hotels)
enum LoyaltyProgramCode {
  LOYALTY_PROGRAM_CODE_UNSPECIFIED = 0;
  AIR_INDIA_MAHARAJA_CLUB = 1;
  SINGAPORE_AIRLINES_KRISFLYER = 2;
  THAI_AIRWAYS_ROYAL_ORCHID_PLUS = 3;
  EMIRATES_SKYWARDS = 4;
  QATAR_AIRWAYS_PRIVILEGE_CLUB = 5;
  VISTARA_CLUB_VISTARA = 6;
  INDIGO_BLUCHIP = 7;
  BRITISH_AIRWAYS_EXECUTIVE_CLUB = 8;
  LUFTHANSA_MILES_AND_MORE = 9;
  AIR_FRANCE_KLM_FLYING_BLUE = 10;
  ETIHAD_AIRWAYS_ETIHAD_GUEST = 11;
  CATHAY_PACIFIC_ASIA_MILES = 12;
  MARRIOTT_BONVOY = 13;
  HILTON_HONORS = 14;
  IHG_ONE_REWARDS = 15;
  TAJ_INNERCIRCLE = 16;
  ACCOR_LIVE_LIMITLESS = 17;
  HYATT_WORLD_OF_HYATT = 18;
}

message LoyaltyProgramProto {
  string id = 1;
  string name = 2;
  LoyaltyProgramType program_type = 3;
  string provider = 4;
  string currency_name = 5;
  string alliance_or_group = 6;
  string logo_url = 7;
  // Airline-specific metadata (only populated when program_type is AIRLINE)
  AirlineCode airline_code = 8;
  LoyaltyProgramCode program_code = 9;
}

// Airline-specific loyalty program metadata
message AirlineLoyaltyProgramProto {
  string id = 1;
  string loyalty_program_id = 2;
  LoyaltyProgramCode program_code = 3;
  AirlineCode airline_code = 4;
  AirlineAlliance alliance = 5;
}

message ListLoyaltyProgramsRequest {
  // Optional filter by program type
  LoyaltyProgramType program_type = 1;
}

message ListLoyaltyProgramsResponse {
  repeated LoyaltyProgramProto programs = 1;
}

message GetLoyaltyProgramRequest {
  string program_id = 1;
}

message GetLoyaltyProgramResponse {
  LoyaltyProgramProto program = 1;
}

message CardLoyaltyTransferRatioProto {
  string id = 1;
  string card_id = 2;
  string loyalty_program_id = 3;
  double source_points = 4;
  double target_points = 5;
  bool is_active = 6;
  string notes = 7;
}

message FindCardLoyaltyTransferRatiosRequest {
  string card_id = 1;
  string loyalty_program_id = 2;
}

message FindCardLoyaltyTransferRatiosResponse {
  repeated CardLoyaltyTransferRatioProto ratios = 1;
}

// AirlineLoyaltyProgram request/response messages
message ListAirlineLoyaltyProgramsRequest {
  // Optional filter by airline code
  AirlineCode airline_code = 1;
}

message ListAirlineLoyaltyProgramsResponse {
  repeated AirlineLoyaltyProgramProto airline_programs = 1;
}

message GetAirlineLoyaltyProgramRequest {
  oneof lookup {
    // Lookup by program code
    LoyaltyProgramCode program_code = 1;
    // Lookup by airline code (returns first match)
    AirlineCode airline_code = 2;
  }
}

message GetAirlineLoyaltyProgramResponse {
  AirlineLoyaltyProgramProto airline_program = 1;
}

enum AwardCabinClassProto {
  AWARD_CABIN_CLASS_UNSPECIFIED = 0;
  AWARD_CABIN_CLASS_ECONOMY = 1;
  AWARD_CABIN_CLASS_PREMIUM_ECONOMY = 2;
  AWARD_CABIN_CLASS_BUSINESS = 3;
  AWARD_CABIN_CLASS_FIRST = 4;
}

enum AwardTypeProto {
  AWARD_TYPE_UNSPECIFIED = 0;
  AWARD_TYPE_SAVER = 1;
  AWARD_TYPE_STANDARD = 2;
  AWARD_TYPE_PEAK = 3;
  AWARD_TYPE_OFF_PEAK = 4;
  AWARD_TYPE_DYNAMIC = 5;
}

enum AwardTripTypeProto {
  AWARD_TRIP_TYPE_UNSPECIFIED = 0;
  AWARD_TRIP_TYPE_ONE_WAY = 1;
  AWARD_TRIP_TYPE_RETURN = 2;
}

enum AwardCostConfidenceProto {
  AWARD_COST_CONFIDENCE_UNSPECIFIED = 0;
  AWARD_COST_CONFIDENCE_HIGH = 1;
  AWARD_COST_CONFIDENCE_MEDIUM = 2;
  AWARD_COST_CONFIDENCE_LOW = 3;
  AWARD_COST_CONFIDENCE_NONE = 4;
}

enum AwardCostSourceTypeProto {
  AWARD_COST_SOURCE_TYPE_UNSPECIFIED = 0;
  AWARD_COST_SOURCE_TYPE_OFFICIAL_AWARD_CHART = 1;
  AWARD_COST_SOURCE_TYPE_NO_DATA = 2;
}

message PredictAwardCostRequest {
  string origin_airport = 1;
  string destination_airport = 2;
  string loyalty_program_id = 3;
  LoyaltyProgramCode loyalty_program_code = 4;
  string program_name = 5;
  AwardCabinClassProto cabin_class = 6;
  AwardTypeProto award_type = 7;
  AwardTripTypeProto trip_type = 8;
  AirlineCode operating_airline = 9;
  int32 route_distance_miles = 10;
}

message PredictAwardCostResponse {
  string origin_airport = 1;
  string destination_airport = 2;
  google.protobuf.StringValue loyalty_program_id = 3;
  AwardCabinClassProto cabin_class = 4;
  google.protobuf.DoubleValue points_estimate = 5;
  google.protobuf.DoubleValue points_low = 6;
  google.protobuf.DoubleValue points_high = 7;
  google.protobuf.DoubleValue surcharge_estimate = 8;
  google.protobuf.StringValue surcharge_currency = 9;
  AwardCostConfidenceProto confidence = 10;
  AwardCostSourceTypeProto source_type = 11;
  string note = 12;
}
